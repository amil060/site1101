<header class="site-header">
  <div class="container site-header__inner">
    <a class="brand" href="{{ site.baseurl }}/">{{ site.title }}</a>

    <button class="nav-toggle" aria-controls="site-nav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="nav-toggle__bars" aria-hidden="true"></span>
    </button>

    <nav id="site-nav" class="site-nav" role="navigation">
      <ul class="nav__list">
        <li><a class="nav__link {% if page.url == '/' %}is-active{% endif %}" href="{{ site.baseurl }}/">Home</a></li>
        <li><a class="nav__link {% if page.url contains '/about' %}is-active{% endif %}" href="{{ site.baseurl }}/about/">About</a></li>
        <li><a class="nav__link {% if page.url contains '/projects' %}is-active{% endif %}" href="{{ site.baseurl }}/projects/">Projects</a></li>
        <li><a class="nav__link {% if page.url contains '/contact' %}is-active{% endif %}" href="{{ site.baseurl }}/contact/">Contact</a></li>
      </ul>
    </nav>

    <div class="header-actions">
      <div class="control-group" role="group" aria-label="Page controls">
        <button type="button" class="control control--icon theme-toggle" aria-pressed="false" aria-label="Toggle dark mode" title="Toggle dark mode">
          <!-- Moon icon (will toggle to sun when active) -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" fill="currentColor"/></svg>
        </button>

        <a class="control control--link" href="{{ site.repo_url }}" target="_blank" rel="noopener" aria-label="View source on GitHub">View source</a>
      </div>
    </div>
  </div>
</header>
